name: Deploy DataFlow to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "platform/dataflow-studio/**"
      - ".github/workflows/deploy-dataflow.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/dataflow-studio
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/dataflow-studio/package-lock.json
      - run: npm ci
      - run: npm run build -- --base=/ai-workspace/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: platform/dataflow-studio/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
